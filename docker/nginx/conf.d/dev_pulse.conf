# Reverse proxy with SSL termination for dev_pulse
# - Terminates TLS on 443
# - Proxies to the Next.js custom server on http://web:3000
#
# Required env/mounts in docker-compose.prod.yml:
# - Mount Let's Encrypt certificates (or any CA cert) into /etc/letsencrypt
# - Or adjust paths below

upstream web_upstream {
  server web:3000;
  keepalive 64;
}

server {
  listen 80;
  server_name _;

  # Allow Let's Encrypt HTTP-01 challenge if you use certbot in the same host
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name _;

  ssl_certificate     /etc/letsencrypt/live/dev-pulse/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev-pulse/privkey.pem;

  # Recommended settings (tweak as needed)
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Proxy headers
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  # WebSockets (Next dev / any ws)
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  location / {
    proxy_pass http://web_upstream;
  }
}
