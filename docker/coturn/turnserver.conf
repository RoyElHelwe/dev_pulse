# =============================================================================
# Coturn TURN Server Configuration
# =============================================================================
# This provides NAT traversal for WebRTC when direct peer-to-peer fails
# =============================================================================

# TURN server listening port
listening-port=3478

# TLS listening port (optional, requires certificates)
# tls-listening-port=5349

# Relay address (auto-detected with DETECT_RELAY_IP=yes)
# relay-ip=YOUR_SERVER_IP

# External IP (auto-detected with DETECT_EXTERNAL_IP=yes)
# external-ip=YOUR_EXTERNAL_IP

# Realm (your domain)
realm=devpulse.local

# Server name
server-name=devpulse-turn

# Authentication credentials
# For production, use database or REST API authentication
user=devpulse:devpulse123

# Long-term credential mechanism
lt-cred-mech

# Fingerprint for STUN
fingerprint

# Disable CLI (not needed for simple setup)
no-cli

# Log file (optional - comment out for docker logs)
# log-file=/var/log/coturn/turnserver.log

# Verbose logging for debugging
# verbose

# Relay threads (adjust based on CPU cores)
relay-threads=4

# Max allocations per user
max-allocations-per-user=50

# Total quota (max allocations)
total-quota=1000

# Relay port range
min-port=49152
max-port=65535

# No multicast peers (security)
no-multicast-peers

# Disable old TLS versions
no-tlsv1
no-tlsv1_1

# Mobility (for mobile clients)
mobility

# Stale nonce lifetime (seconds)
stale-nonce=600

# Max bandwidth per session (bytes/second, 0 = unlimited)
# Limit to 1 Mbps per session for cost control
max-bps=1000000

# Allocation lifetime (seconds)
# Default is 600, can increase for longer calls
# channel-lifetime=600

# Permission lifetime (seconds)  
# permission-lifetime=300
