# =============================================================================
# Docker Compose Production Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  api-gateway:
    build:
      target: api-gateway
    volumes: []  # No source mounts in production
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  auth-service:
    build:
      target: auth-service
    volumes: []
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  workspace-service:
    build:
      target: workspace-service
    volumes: []
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  web:
    build:
      target: web
    volumes: []
    restart: always
    environment:
      # In production, terminate SSL at the reverse proxy (nginx/Caddy) and serve HTTP here.
      - DISABLE_TLS=true
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  nats:
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # SSL termination reverse proxy (mount your Let's Encrypt certs here)
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    depends_on:
      - web
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Mount LE certs from the host (adjust path + domain folder name)
      # Example (host): /etc/letsencrypt/live/dev-pulse/{fullchain.pem,privkey.pem}
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Optional webroot for ACME HTTP-01 challenges
      - ./docker/nginx/certbot-www:/var/www/certbot

  # Remove mailpit in production
  mailpit:
    deploy:
      replicas: 0
