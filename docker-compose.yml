# Production-like stack (what evaluators run):  make   or   docker compose up --build
# Development with hot reload:                   make dev
# Wires postgres db, NestJS api, Next.js web frontend, and nginx reverse proxy on a shared network.
name: dev_pulse

services:
  # PostgreSQL database storing persistent relational application data (users, office state, tasks).
  # Runs postgres:16-alpine on internal port 5432 with no host ports exposed in production.
  # Persistent data is stored in the db_data volume; healthcheck waits for pg_isready before api connects.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # NestJS backend service providing REST API endpoints (/api/*) and WebSockets (/socket.io/*).
  # Built using the prod multi-stage target and runs on internal port 4000 without exposing host ports.
  # Loads .env for secrets and OAuth; dev-login flag is ignored in production (requires NODE_ENV!=production).
  # Waits for db healthcheck before running prisma db push and launching the application.
  api:
    build:
      context: ./apps/api
      target: prod
    restart: unless-stopped
    # Auth settings (SMTP, OAuth keys...) come from .env; the values below win.
    env_file: .env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      APP_URL: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-8443}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy

  # Next.js frontend serving web pages and the Phaser 2D virtual office client.
  # Built using the prod standalone target and runs on internal port 3000.
  # Communicates with api internally and is accessed publicly exclusively through the proxy service.
  web:
    build:
      context: ./apps/web
      target: prod
    restart: unless-stopped
    depends_on:
      - api

  # Nginx reverse proxy acting as the single public TLS entry point on port 8443 (maps to 443).
  # TLS is required for WebRTC microphone access in proximity voice chat.
  # Generates a self-signed certificate for SERVER_NAME stored in the certs volume.
  # Routes /api and /socket.io to api, and all other traffic to web.
  proxy:
    build: ./nginx
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    ports:
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      - api
      - web

# Named volumes for data persistence across container restarts and rebuilds.
volumes:
  # Named volume for persistent PostgreSQL database files.
  db_data:
  # Named volume storing generated TLS certificates (cert.pem and key.pem).
  certs:
