# Production-like stack (what evaluators run):  make   or   docker compose up --build
# Development with hot reload:                   make dev
name: dev_pulse

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: prod
    restart: unless-stopped
    # Auth settings (SMTP, OAuth keys...) come from .env; the values below win.
    env_file: .env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      APP_URL: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-8443}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: prod
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    build: ./nginx
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    ports:
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      - api
      - web

volumes:
  db_data:
  certs:
