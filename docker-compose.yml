# Production-like stack (what evaluators run):  make   or   docker compose up --build
# Development with hot reload:                   make dev
# Wires postgres db, local blockchain (chain), NestJS api, Next.js web frontend, nginx reverse proxy,
# and the email service (postfix Gmail relay + email-api) on a shared network.
name: dev_pulse

services:
  # PostgreSQL database storing persistent relational application data (users, office state, tasks).
  # Runs postgres:16-alpine on internal port 5432 with no host ports exposed in production.
  # Persistent data is stored in the db_data volume; healthcheck waits for pg_isready before api connects.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local EVM blockchain (Anvil) for PulseCoin and the kitchen shop contracts (deployed by the api on start).
  # Internal only (no host port); its state is dumped to the chain_data volume so coins survive restarts.
  chain:
    build: ./chain
    restart: unless-stopped
    volumes:
      - chain_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'cast block-number --rpc-url http://localhost:8545']
      interval: 5s
      timeout: 5s
      retries: 10

  # NestJS backend service providing REST API endpoints (/api/*) and WebSockets (/socket.io/*).
  # Built using the prod multi-stage target and runs on internal port 4000 without exposing host ports.
  # Loads .env for secrets and OAuth; dev-login flag is ignored in production (requires NODE_ENV!=production).
  # Waits for db healthcheck before running prisma db push and launching the application.
  api:
    build:
      context: ./apps/api
      target: prod
    restart: unless-stopped
    # Auth settings (SMTP, OAuth keys...) come from .env; the values below win.
    env_file: .env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      APP_URL: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-8443}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # The local chain by default; set CHAIN_RPC_URL (and a funded CHAIN_RELAYER_KEY) in .env for e.g. Avalanche Fuji.
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-http://chain:8545}
    depends_on:
      db:
        condition: service_healthy
      chain:
        condition: service_healthy

  # Next.js frontend serving web pages and the Phaser 2D virtual office client.
  # Built using the prod standalone target and runs on internal port 3000.
  # Communicates with api internally and is accessed publicly exclusively through the proxy service.
  web:
    build:
      context: ./apps/web
      target: prod
    restart: unless-stopped
    depends_on:
      - api

  # Nginx reverse proxy acting as the single public TLS entry point on port 8443 (maps to 443).
  # TLS is required for WebRTC microphone access in proximity voice chat.
  # Generates a self-signed certificate for SERVER_NAME stored in the certs volume.
  # Routes /api and /socket.io to api, and all other traffic to web.
  proxy:
    build: ./nginx
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    ports:
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      - api
      - web

  # Postfix SMTP relay that forwards all mail through Gmail (smtp.gmail.com:587, STARTTLS required).
  # Logs in with GMAIL_USER + App Password or OAuth2 (see apps/email-service/README.md).
  # Never publish its port: it is reachable only on the compose network, otherwise it is an open relay.
  # Queued mail is kept in the postfix_queue volume across restarts.
  postfix:
    image: boky/postfix:latest
    restart: unless-stopped
    environment:
      RELAYHOST: '[smtp.gmail.com]:587'
      RELAYHOST_USERNAME: ${GMAIL_USER:-}
      RELAYHOST_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      # OAuth2 replaces the App Password, but only once GMAIL_OAUTH_REFRESH_TOKEN is set
      # (the image switches to OAuth as soon as a client id is present).
      XOAUTH2_CLIENT_ID: ${GMAIL_OAUTH_REFRESH_TOKEN:+${GMAIL_OAUTH_CLIENT_ID}}
      XOAUTH2_SECRET: ${GMAIL_OAUTH_REFRESH_TOKEN:+${GMAIL_OAUTH_CLIENT_SECRET}}
      XOAUTH2_INITIAL_REFRESH_TOKEN: ${GMAIL_OAUTH_REFRESH_TOKEN:-}
      # Placeholder; marked expired so Postfix fetches a fresh one on first send.
      XOAUTH2_INITIAL_ACCESS_TOKEN: expired
      ALLOWED_SENDER_DOMAINS: gmail.com
      POSTFIX_smtp_tls_security_level: encrypt
      POSTFIX_myhostname: email-relay
      # Gmail rejects messages over ~25 MB; fail fast instead of queueing them.
      POSTFIX_message_size_limit: '26214400'
    volumes:
      - postfix_queue:/var/spool/postfix

  # FastAPI HTTP API for sending email (POST /send with X-API-Key, GET /health) through the postfix relay.
  # Refuses to start without EMAIL_API_KEY (`make` generates one); /send returns 503 until GMAIL_USER is set.
  # Published on localhost only. To let other machines call it use '0.0.0.0:${EMAIL_API_PORT:-8025}:8025'
  # and also open the port in the host / cloud firewall (preferably behind HTTPS).
  email-api:
    build: ./apps/email-service
    restart: unless-stopped
    environment:
      SMTP_HOST: postfix
      SMTP_PORT: 587
      FROM_ADDRESS: ${GMAIL_USER:-}
      FROM_NAME: ${EMAIL_API_FROM_NAME:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      RATE_LIMIT_PER_MIN: ${EMAIL_API_RATE_LIMIT_PER_MIN:-30}
    ports:
      - '127.0.0.1:${EMAIL_API_PORT:-8025}:8025'
    depends_on:
      - postfix

# Named volumes for data persistence across container restarts and rebuilds.
volumes:
  # Named volume for persistent PostgreSQL database files.
  db_data:
  # Named volume storing generated TLS certificates (cert.pem and key.pem).
  certs:
  # Named volume holding the local blockchain's state (PulseCoin balances, kitchen purchases).
  chain_data:
  # Named volume holding the postfix mail queue (and OAuth tokens).
  postfix_queue:
