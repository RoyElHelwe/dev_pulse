services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ft_trans_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ft_trans}
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-ft_trans}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ft_trans_network

  # Prisma Migration Runner
  prisma-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prisma
    container_name: ft_trans_migrate
    command: sh -c "cd /app/packages/database && pnpm prisma:push --accept-data-loss"
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://dev:dev@postgres:5432/ft_trans}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ft_trans_network
    restart: "no"

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: ft_trans_redis
    restart: unless-stopped
    ports:
      - '6378:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ft_trans_network

  # NATS Message Bus
  nats:
    image: nats:2-alpine
    container_name: ft_trans_nats
    restart: unless-stopped
    ports:
      - '4222:4222'
      - '8222:8222'
      - '6222:6222'
    command: '--http_port 8222 --js'
    healthcheck:
      test: ['CMD', 'nats-server', '--help']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ft_trans_network

  # Mailpit - Email Testing
  mailpit:
    image: axllent/mailpit:v1.18.1
    container_name: ft_trans_mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ft_trans_network

  # API Gateway (NestJS)
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api-gateway-dev
    container_name: ft_trans_api_gateway
    restart: unless-stopped
    ports:
      - '4000:4000'
    volumes:
      - ./apps/api-gateway/src:/app/apps/api-gateway/src
      - ./packages/database/src:/app/packages/database/src
      - ./packages/backend-common/src:/app/packages/backend-common/src
      - ./packages/shared-types/src:/app/packages/shared-types/src
      - ./prisma:/app/prisma
      - ./certs:/app/certs:ro
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://dev:dev@postgres:5432/ft_trans}
      - REDIS_URL=${REDIS_URL_DOCKER:-redis://redis:6379}
      - NATS_URL=${NATS_URL_DOCKER:-nats://nats:4222}
      - API_GATEWAY_PORT=${API_GATEWAY_PORT:-4000}
      - CORS_ORIGINS=${CORS_ORIGINS_DOCKER:-http://localhost:3000}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL_DOCKER:-http://auth-service:3001}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-localhost}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # File watching polling for Docker
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      auth-service:
        condition: service_started
      workspace-service:
        condition: service_started
      task-service:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ft_trans_network
    # Add memory limits for dev
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Auth Service (Microservice)
  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: auth-service-dev
    container_name: ft_trans_auth_service
    restart: unless-stopped
    ports:
      - '3001:3001'
    volumes:
      - ./services/auth-service/src:/app/services/auth-service/src
      - ./packages/database/src:/app/packages/database/src
      - ./packages/backend-common/src:/app/packages/backend-common/src
      - ./prisma:/app/prisma
      - ./certs:/app/certs:ro
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://dev:dev@postgres:5432/ft_trans}
      - NATS_URL=${NATS_URL_DOCKER:-nats://nats:4222}
      - PORT=${AUTH_PORT:-3001}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-localhost}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@localhost}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ft_trans_network
  workspace-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: workspace-service-dev
    container_name: ft_trans_workspace_service
    restart: unless-stopped
    ports:
      - '3002:3002'
    volumes:
      - ./services/workspace-service/src:/app/services/workspace-service/src
      - ./packages/database/src:/app/packages/database/src
      - ./packages/backend-common/src:/app/packages/backend-common/src
      - ./packages/shared-types/src:/app/packages/shared-types/src
      - ./prisma:/app/prisma
      - ./certs:/app/certs:ro
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://dev:dev@postgres:5432/ft_trans}
      - NATS_URL=${NATS_URL_DOCKER:-nats://nats:4222}
      - PORT=${WORKSPACE_PORT:-3002}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@localhost}
      - APP_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ft_trans_network

  # Task Service (Microservice)
  task-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: task-service-dev
    container_name: ft_trans_task_service
    restart: unless-stopped
    ports:
      - '3003:3003'
    volumes:
      - ./services/task-service/src:/app/services/task-service/src
      - ./packages/database/src:/app/packages/database/src
      - ./packages/backend-common/src:/app/packages/backend-common/src
      - ./packages/shared-types/src:/app/packages/shared-types/src
      - ./prisma:/app/prisma
      - ./certs:/app/certs:ro
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://dev:dev@postgres:5432/ft_trans}
      - NATS_URL=${NATS_URL_DOCKER:-nats://nats:4222}
      - REDIS_URL=${REDIS_URL_DOCKER:-redis://redis:6379}
      - PORT=3003
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL:-}
      - BLOCKCHAIN_PRIVATE_KEY=${BLOCKCHAIN_PRIVATE_KEY:-}
      - BLOCKCHAIN_NETWORK=${BLOCKCHAIN_NETWORK:-sepolia}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ft_trans_network

  # Web Frontend (Next.js)
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web-dev
    container_name: ft_trans_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/components:/app/apps/web/components
      - ./apps/web/lib:/app/apps/web/lib
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/proxy.ts:/app/apps/web/proxy.ts
      - ./apps/web/server.js:/app/apps/web/server.js
      - ./packages/shared-types/src:/app/packages/shared-types/src
      - ./certs:/app/certs:ro
      # Anonymous volumes to prevent file watching in node_modules
      - /app/apps/web/node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:4000}
      - HOSTNAME=0.0.0.0
      - PORT=3000
      # === Docker File Watching Performance Fixes ===
      # Use polling for file watching (fixes slow HMR in Docker)
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLL_INTERVAL=300
      - CHOKIDAR_USEPOLLING=true
      # Reduce polling interval (ms) - balance between responsiveness and CPU
      - CHOKIDAR_INTERVAL=300
    depends_on:
      - api-gateway
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ft_trans_network
    # Add memory limits for dev to prevent resource exhaustion
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ft_trans_network:
    driver: bridge
