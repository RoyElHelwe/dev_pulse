# Dev Pulse reverse proxy configuration.
# Used in all environments (production and development) as the single TLS entry point on port 443.
# Wires client traffic to the api (NestJS:4000) and web (Next.js:3000) backend services.
# Single entry point: https://<SERVER_NAME>:<HTTPS_PORT>
#   /api/*        -> api (NestJS REST)
#   /socket.io/*  -> api (NestJS websockets: game, voice signaling, chat)
#   everything    -> web (Next.js)

# Map client Connection header based on Upgrade header presence for WebSocket hop-by-hop handling.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# HTTPS server block terminating TLS and routing incoming traffic to container upstreams.
server {
  # TLS on port 443 with HTTP/2; required for secure communication and browser microphone permissions (voice chat).
  listen 443 ssl;
  http2 on;
  server_name _;
  server_tokens off;

  # TLS certificate and private key generated on startup by generate-cert.sh; restricts to TLS 1.2 and 1.3.
  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # Limits request body size to 10MB for file/avatar uploads.
  client_max_body_size 10m;

  # Security headers to mitigate MIME-type sniffing, clickjacking, and referrer leakage.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Re-resolve container names so restarting api/web never breaks the proxy.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:4000;
  set $web http://web:3000;

  # Upstream headers: HTTP/1.1 and upgrade headers are required for WebSocket handshakes.
  # Passes original client Host (including port 8443 for redirects), remote IP, and HTTPS scheme.
  proxy_http_version 1.1;
  proxy_set_header Host              $http_host; # keeps the port (8443) for redirects
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;

  # REST API location: routes /api/* requests directly to the NestJS api container ($api).
  location /api/ {
    proxy_pass $api;
  }

  # WebSocket location: routes Socket.IO traffic to api for real-time office multiplayer and voice signaling.
  # proxy_read_timeout 1h keeps long-lived WebSocket sessions alive without premature idle disconnection.
  location /socket.io/ {
    proxy_pass $api;
    proxy_read_timeout 1h;
  }

  # Default root location: proxies all frontend page loads and static assets to the Next.js web container ($web).
  location / {
    proxy_pass $web;
  }
}
