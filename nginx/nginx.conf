# Single entry point: https://<SERVER_NAME>:<HTTPS_PORT>
#   /api/*        -> api (NestJS REST)
#   /socket.io/*  -> api (NestJS websockets: game, voice signaling, chat)
#   everything    -> web (Next.js)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  server_tokens off;

  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 10m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Re-resolve container names so restarting api/web never breaks the proxy.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:4000;
  set $web http://web:3000;

  proxy_http_version 1.1;
  proxy_set_header Host              $http_host; # keeps the port (8443) for redirects
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;

  location /api/ {
    proxy_pass $api;
  }

  location /socket.io/ {
    proxy_pass $api;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass $web;
  }
}
